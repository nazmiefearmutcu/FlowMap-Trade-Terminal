[package]
name = "flowmap"
version = "1.6.1"
description = "FlowMap — dual-market order-flow terminal"
authors = ["nazmiefearmutcu"]
license = "Apache-2.0"
repository = "https://github.com/nazmiefearmutcu/flowmap"
edition = "2021"
# Raised from 1.77: `std::fs::File::try_lock` (the single-instance guard) and
# `TryLockError` were stabilized in Rust 1.89. Older toolchains cannot compile
# the shell, so the manifest must not claim they can.
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Session token entropy. Already in the tree via tauri.
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Already in the dependency tree via tauri — declared directly for the native
# error dialogs, the job object that reaps the sidecar, the focus-existing-window
# helper and the process creation flags.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  # CreateJobObjectW's signature needs the Security types, so this feature is
  # required (not unused), even though no code names them directly.
  "Win32_Networking_WinSock",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
