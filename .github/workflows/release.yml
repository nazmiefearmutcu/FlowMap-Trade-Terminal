name: release

# Builds the self-contained FlowMap desktop installers for macOS (Apple Silicon
# + Intel), Windows (x64 + ARM64) and Linux, and attaches them to a GitHub
# Release.
#
# Native Python wheels (numpy / polars / msgspec / curl-cffi …) must be built on
# their own OS+arch, so each installer is produced on its matching runner — the
# bundled pyruntime cannot be cross-built. Triggered by pushing a `vX.Y.Z` tag;
# `workflow_dispatch` can dry-run the build (no upload) or (re)release an
# existing tag, which requires typing that tag into the `confirm` input.
#
# Pipeline (least privilege at every step):
#   prepare     reads the tag, checks the nine version fields and the notes file
#   gate        the full CI workflow (ci.yml) on the tagged commit; nothing below
#               starts when it is red
#   build       one leg per OS/arch, contents: read only, no publish token; the
#               installers leave the leg as workflow artifacts. Every leg installs
#               or launches what it built and checks the server it starts
#               (scripts/packaged_smoke_windows.py on Windows,
#               scripts/packaged_smoke_posix.py on macOS and Linux), and records the
#               third-party components of its own runtime
#   publish     the only job with write scope. It runs behind the `release`
#               GitHub Environment (add required reviewers in repository settings
#               to make the publish step wait for a human), attests and checksums
#               the installers, uploads them, verifies the uploaded bytes against
#               SHA256SUMS and only then flips the release out of draft.
#
# Every released installer is signed with a SLSA build-provenance attestation
# and listed in a single `SHA256SUMS` asset together with THIRD-PARTY-NOTICES.txt,
# the Apache-2.0 LICENSE, NOTICE and the font licence texts, so a download can be
# tied back to this repo and this commit without trusting the release page — see
# SECURITY.md.
on:
  push:
    tags:
      # GitHub tag filters are glob-ish (no `(...)` groups or `{n,m}`
      # quantifiers). Only SemVer tags are releases; hotfixes are patch versions.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build and release (e.g. v1.2.0). Leave blank to build without releasing."
        required: false
        default: ""
      confirm:
        description: "Required when `tag` is set: type the same tag again to confirm the release."
        required: false
        default: ""

# No token scope unless a job declares it below.
permissions: {}

# Exact versions of the tools that build the installers. Bump them deliberately:
# ci.yml, windows-benchmark.yml and macos-runtime-audit.yml carry the same UV_VERSION.
env:
  UV_VERSION: "0.12.12"
  RUST_TOOLCHAIN: "1.98.0"

# Two runs for the same tag must not race to publish; a running release is
# never cancelled half-way through an upload. Both triggers resolve to the tag name,
# so a tag push and a manual re-release of that tag queue against each other.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the target tag and whether we are releasing (vs. a dry-run build).
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      do_release: ${{ steps.resolve.outputs.do_release }}
    steps:
      - id: resolve
        # Untrusted github-context values are passed via env and only ever read
        # as quoted shell variables (never interpolated into the script body),
        # so a crafted tag/input cannot inject commands.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          TAG=""
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            if [ "$INPUT_CONFIRM" != "$INPUT_TAG" ]; then
              echo "Refusing to release $INPUT_TAG: type the same tag into the confirm input." >&2
              exit 1
            fi
            TAG="$INPUT_TAG"
          fi
          if [ -n "$TAG" ]; then
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $TAG (expected vX.Y.Z; hotfixes use a patch version)" >&2
              exit 1
            fi
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "do_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.resolve.outputs.tag && format('refs/tags/{0}', steps.resolve.outputs.tag) || github.sha }}
          persist-credentials: false

      - name: Verify release versions and release notes for the selected tag
        if: steps.resolve.outputs.do_release == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # The nine version fields must agree with each other and with the tag
          # (scripts/check_release_versions.py, also run on every push by ci.yml).
          python3 scripts/check_release_versions.py --tag "$TAG"
          # The notes file is part of the release; there is no auto-generated fallback.
          NOTES="docs/release-notes-${TAG#v}.md"
          if [ ! -s "$NOTES" ]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi

      # A published release is never rebuilt or overwritten: its installers and
      # SHA256SUMS are what people already downloaded. A draft left by an earlier
      # attempt is still reusable, and a tag without a release starts a new draft.
      - name: Refuse to rebuild or overwrite a published release
        if: steps.resolve.outputs.do_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>"$RUNNER_TEMP/release-view.err")"; then
            if [ "$DRAFT" = "false" ]; then
              echo "Release $TAG is already published. Refusing to rebuild or overwrite it: cut the next version instead." >&2
              exit 1
            fi
            echo "Release $TAG exists as a draft; the publish job will reuse it."
          elif grep -qi 'not found' "$RUNNER_TEMP/release-view.err"; then
            echo "No release exists yet for $TAG; the publish job will create a draft."
          else
            cat "$RUNNER_TEMP/release-view.err" >&2
            echo "Could not read the release state for $TAG." >&2
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # The full CI gate (typecheck, lint, unit, server, shell and e2e tests) on the
  # commit being released. Nothing is drafted, built or published unless it is
  # green, so a tag cannot ship code that CI would reject.
  # ---------------------------------------------------------------------------
  gate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.tag && format('refs/tags/{0}', needs.prepare.outputs.tag) || github.sha }}
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Build one installer per OS/arch. Read-only: no token reaches the build steps
  # and the installers leave the leg only as workflow artifacts.
  # ---------------------------------------------------------------------------
  build:
    needs: [prepare, gate]
    # Run when the gate passed (releasing or a dry-run build). Never run if the
    # gate or prepare failed or the run was cancelled.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.gate.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon. macos-14 is no longer offered to this repository (the run was
          # refused with "configuration 'macos-14-arm64-us-default' is not supported"), so the
          # leg uses the current Apple Silicon image; ci.yml's shell-macos leg matches it.
          - os: macos-15
            triple: aarch64-apple-darwin
            kind: macos
          # Intel macOS. NOT `macos-13`: that image was retired on 2025-12-04, so
          # jobs targeting it queue forever without ever being assigned a runner.
          # `macos-15-intel` is the x86_64 replacement (available until Aug 2027,
          # after which Actions drops Intel macOS entirely).
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            kind: macos
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            kind: windows
          # Windows on ARM (Snapdragon X laptops, Surface, and Windows 11 in a
          # VM on Apple Silicon). `windows-11-arm` is a GA GitHub-hosted ARM64
          # image, so this leg is a NATIVE build — no `--target` flag, and the
          # bundle lands in the same target/release/bundle path as every other
          # runner. An emulated x64 install works on these machines too, but it
          # runs an emulated CPython over an emulated webview; native is the
          # build we actually want people to download.
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            kind: windows
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            kind: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Uniform shell across all runners; on Windows this is Git-Bash, which
        # is what bundle-python.sh is written for.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag && format('refs/tags/{0}', needs.prepare.outputs.tag) || github.sha }}
          persist-credentials: false

      # The About panel prints the commit the build came from (client/src/ui/About.tsx).
      # The commit is read from the checkout, which is the tag, not from github.sha,
      # because a manual re-release runs on a branch head.
      - name: Pin the build commit for About
        run: echo "VITE_BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust (host target ${{ matrix.triple }})
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.triple }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install Linux WebView + bundling deps
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            build-essential \
            fuse \
            libfuse2 \
            libgdk-pixbuf2.0-dev \
            gir1.2-gtk-3.0 \
            desktop-file-utils \
            squashfs-tools \
            zsync

      - name: Install Tauri CLI (cargo-tauri)
        # Pinned to the exact crate version whose npm twin CI uses
        # (@tauri-apps/cli@2.11.5, ci.yml shell job) and that Cargo.lock locks
        # (tauri 2.11.5). An unpinned ^2.0 would let a future bad 2.x release
        # change how an old tag rebuilds.
        run: cargo install tauri-cli --version "2.11.5" --locked

      - name: Verify Cargo.lock is current
        working-directory: app/src-tauri
        run: cargo metadata --locked --format-version 1 >/dev/null

      # --- macOS: the existing all-in-one script (client → pyruntime → tauri →
      #     ditto → ad-hoc codesign → dmg). Arch-aware, so it drives both the
      #     Apple-Silicon and Intel runners. ------------------------------------
      # The committed DMG artwork carries a version stamp. The release never
      # re-renders it on the runner (that needed an unpinned Pillow install in
      # the build leg). scripts/check_dmg_art.py refuses a stale stamp here, and
      # ci.yml runs the same check on every push, so a stale release cannot start.
      - name: Verify DMG artwork matches the app version
        if: matrix.kind == 'macos'
        run: python3 scripts/check_dmg_art.py

      # The python-build-standalone lookup in bundle-python.sh authenticates with
      # GITHUB_TOKEN when it is set; unauthenticated calls share a 60-per-hour
      # limit per runner egress IP and intermittently fail. The token goes to the
      # two steps that run bundle-python.sh and nothing else in this job. The
      # job's permissions are read-only (`contents: read`), so the token cannot
      # write to the repository or read any repository secret.
      - name: Build macOS installer (build-dmg.sh)
        if: matrix.kind == 'macos'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash app/scripts/build-dmg.sh

      # --- macOS packaged-app smoke: the DMG this leg built is attached, FlowMap.app
      #     is copied out and launched, and the same loopback checks as the Windows
      #     legs run against its server (scripts/packaged_smoke_posix.py).
      - name: Smoke test the installed macOS app
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          for dmg in app/src-tauri/target/release/bundle/dmg/*.dmg; do
            python3 scripts/packaged_smoke_posix.py --installer "$dmg"
          done

      - name: Preserve macOS runtime minimum evidence
        if: always() && matrix.kind == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-runtime-minimum-${{ matrix.triple }}
          path: |
            app/src-tauri/resources/.cache/macos-runtime-minimum.json
            app/src-tauri/resources/.cache/tauri-macos-minimum.json
          if-no-files-found: warn

      # --- Windows/Linux: client + pyruntime + `cargo tauri build`. The
      #     pyruntime is embedded by Tauri via bundle.resources declared in
      #     tauri.<platform>.conf.json. ------------------------------------------
      - name: Build client (client/dist)
        if: matrix.kind != 'macos'
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Bundle Python runtime (${{ matrix.triple }})
        if: matrix.kind != 'macos'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash app/scripts/bundle-python.sh "${{ matrix.triple }}"

      - name: Generate Tauri icon set
        if: matrix.kind != 'macos'
        working-directory: app/src-tauri
        run: cargo tauri icon ../icons/icon-1024.png

      - name: Build Windows installers (cargo tauri build)
        if: matrix.kind == 'windows'
        working-directory: app/src-tauri
        run: cargo tauri build

      # --- Windows packaged-app smoke: the installers this leg built are installed
      #     on the runner, the installed app is launched, its server answers
      #     /api/health, refuses a foreign Host and an unauthenticated request, the
      #     window closes and no python from the installed runtime keeps running.
      #     It runs on the bundled interpreter (stdlib only) and needs no token.
      - name: Smoke test the installed Windows app
        if: matrix.kind == 'windows'
        run: |
          set -euo pipefail
          PY="app/src-tauri/resources/pyruntime/python.exe"
          for installer in app/src-tauri/target/release/bundle/msi/*.msi \
                           app/src-tauri/target/release/bundle/nsis/*-setup.exe; do
            # A glob that matches nothing stays literal and fails the smoke's own check.
            "$PY" scripts/packaged_smoke_windows.py --installer "$installer"
          done

      # Linux ships two installers and both are required: the .deb and the
      # AppImage. A failed AppImage step fails the leg and blocks publication
      # (scripts/validate_release_assets.py requires all eight installers).
      - name: Build Linux .deb
        if: matrix.kind == 'linux'
        working-directory: app/src-tauri
        run: cargo tauri build --bundles deb

      # The AppImage is packed by linuxdeploy, which must pack the embedded
      # ~500 MB CPython runtime into a squashfs image; Tauri swallows its stderr.
      #   APPIMAGE_EXTRACT_AND_RUN — linuxdeploy and its plugins ARE AppImages
      #     and mount themselves via FUSE, which the runner cannot provide.
      #   NO_STRIP — linuxdeploy strips every bundled shared object; the CPython
      #     runtime has thousands and one unstrippable file aborts the bundle.
      - name: Build Linux AppImage
        if: matrix.kind == 'linux'
        working-directory: app/src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: true
        run: cargo tauri build --bundles appimage

      # --- Linux packaged-app smoke: each installer this leg built is installed or
      #     run in place, the shell is launched under a virtual display (the shell
      #     opens a window) and the same loopback checks as the Windows legs run
      #     against its server (scripts/packaged_smoke_posix.py). The .deb is
      #     installed with apt, the AppImage runs where it was built.
      - name: Smoke test the installed Linux apps (.deb and AppImage)
        if: matrix.kind == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends xvfb
          for installer in app/src-tauri/target/release/bundle/deb/*.deb \
                           app/src-tauri/target/release/bundle/appimage/*.AppImage; do
            xvfb-run -a python3 scripts/packaged_smoke_posix.py --installer "$installer"
          done

      # --- Per-OS smoke test: import every server dep from the BUNDLED
      #     interpreter, then boot the server and poll /api/health (mirrors the
      #     import check in bundle-python.sh and the health poll in main.rs). ----
      - name: Smoke test the bundled server
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = "windows" ]; then
            PY="app/src-tauri/resources/pyruntime/python.exe"
          else
            PY="app/src-tauri/resources/pyruntime/bin/python3.13"
          fi
          echo "interpreter: $PY"
          # The health poll below proves only what the server imports EAGERLY.
          # The lazily-imported closure — above all the equity providers, reached
          # only on a real `equity:` subscribe — is invisible to it, and a bundle
          # that lost pandas would boot green and die on the first `equity:AAPL`.
          # The list is app/scripts/import-gate.py, shared with bundle-python.sh:
          # it used to be written out here as well, and the two copies drifted
          # the moment a target needed an exception.
          "$PY" app/scripts/import-gate.py
          PORT=8799
          DATA_DIR="$(mktemp -d)"
          # Recording is ON here because the shipped shell turns it on by default
          # (recording.json can turn it off), so the smoke exercises the write path
          # a user gets.
          FLOWMAP_HOST=127.0.0.1 FLOWMAP_PORT="$PORT" FLOWMAP_RECORDING_ENABLED=1 FLOWMAP_DATA_DIR="$DATA_DIR" "$PY" -m flowmap_server &
          SRV=$!
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:$PORT/api/health" 2>/dev/null | grep -q '"status":"ok"'; then
              echo "health OK"; ok=1; break
            fi
            sleep 1
          done
          kill "$SRV" 2>/dev/null || true
          wait "$SRV" 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "server health check FAILED"; exit 1; fi

      # THIRD-PARTY-NOTICES is merged from one part per release target, because the
      # bundled Python packages differ by platform (colorama and winloop are Windows
      # only, uvloop is not shipped on Windows, and the win-arm64 leg drops packages
      # and re-pins cryptography). Each leg records the components of the runtime it
      # bundles; the locked Rust crates are platform-independent, so only the Linux
      # leg reads them. An UNKNOWN licence is printed here and must be checked by the
      # owner before publishing.
      - name: Record this target's third-party components
        env:
          TRIPLE: ${{ matrix.triple }}
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          if [ "$KIND" = "windows" ]; then
            PY="app/src-tauri/resources/pyruntime/python.exe"
          else
            PY="app/src-tauri/resources/pyruntime/bin/python3.13"
            [[ -x "$PY" ]] || PY="app/src-tauri/resources/pyruntime/bin/python3"
          fi
          VERSION="$("$PY" -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')"
          mkdir -p notice-parts
          OUT="notice-parts/THIRD-PARTY-NOTICES.$TRIPLE.json"
          if [ "$KIND" = "linux" ]; then
            "$PY" scripts/third_party_notices.py \
              --runtime app/src-tauri/resources/pyruntime \
              --client client \
              --version "$VERSION" \
              --target "$TRIPLE" \
              --cargo app/src-tauri \
              --out "$OUT"
          else
            "$PY" scripts/third_party_notices.py \
              --runtime app/src-tauri/resources/pyruntime \
              --client client \
              --version "$VERSION" \
              --target "$TRIPLE" \
              --out "$OUT"
          fi

      - name: Upload this target's third-party notice part
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: third-party-notices-${{ matrix.triple }}
          path: notice-parts/THIRD-PARTY-NOTICES.${{ matrix.triple }}.json
          if-no-files-found: error
          retention-days: 7

      # The installer sizes quoted in the release notes need a source that is not a
      # guess. This prints what the leg actually produced into the job summary, and
      # because it runs on dry-run builds too, the sizes can be checked BEFORE the
      # tag is cut.
      - name: Report produced installers
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -euo pipefail
          B="app/src-tauri/target/release/bundle"
          {
            echo "### $TRIPLE"
            echo ""
            echo "| installer | size | bytes |"
            echo "|---|---|---|"
            find "$B" -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
                                 -o -name '*.deb' -o -name '*.AppImage' \) -print0 \
              | while IFS= read -r -d '' f; do
                  # Both: `du -h` for a human reading the summary, and the exact
                  # byte count, because the download table quotes MB and a
                  # rounded MiB cannot be converted back into one.
                  printf '| `%s` | %s | %s |\n' "$(basename "$f")" \
                    "$(du -h "$f" | cut -f1)" "$(wc -c < "$f" | tr -d ' ')"
                done
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # `tee`, not `>>`: the step summary is not readable through the API, so
          # a dry-run build could report sizes that no one could then fetch to
          # update the download tables with.

      # One list, resolved once and reused by the upload — so what is shipped is
      # the file that was built, renamed to the release naming scheme.
      - name: Collect the produced installers
        id: installers
        env:
          KIND: ${{ matrix.kind }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          B="app/src-tauri/target/release/bundle"
          case "$KIND" in
            macos)   FILES=$(ls "$B"/dmg/*.dmg) ;;
            windows) FILES=$(ls "$B"/msi/*.msi "$B"/nsis/*-setup.exe) ;;
            # Both Linux installers are required; a missing one fails here.
            linux)   FILES=$(ls "$B"/deb/*.deb "$B"/appimage/*.AppImage) ;;
          esac
          # Dry runs keep the bundler's names; a release renames to the
          # FlowMap_<version>_<suffix> scheme (no leading v).
          REL="${TAG#v}"
          RENAMED=""
          while IFS= read -r n; do
            [ -z "$n" ] && continue
            new="$n"
            if [ -n "$REL" ]; then
              new="$(printf '%s' "$n" | sed -E 's#^(.*/)?FlowMap_[^_]+#\1FlowMap_'"$REL"'#')"
              [ "$n" = "$new" ] || mv "$n" "$new"
            fi
            RENAMED="${RENAMED}${new}"$'\n'
          done <<< "$FILES"
          echo "$RENAMED"
          # Multi-line step output: the delimiter must not occur in the payload,
          # and these are build-dir paths, so a literal marker is safe.
          { echo "files<<__FLOWMAP_EOF__"; printf '%s' "$RENAMED"; echo "__FLOWMAP_EOF__"; } >> "$GITHUB_OUTPUT"

      # Hands the installers to the publish job. The publish job, not this leg,
      # attests, checksums and uploads them.
      - name: Upload the installers as workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installers-${{ matrix.triple }}
          path: ${{ steps.installers.outputs.files }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The only job with write scope and the only one that runs behind the release
  # Environment. It runs no package manager or build script: it attests,
  # checksums, uploads, verifies the uploaded bytes and publishes.
  # ---------------------------------------------------------------------------
  publish:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.do_release == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-22.04
    # Put required reviewers on the `release` environment (repository Settings →
    # Environments) to hold every publish until someone approves it. Without
    # reviewers the environment only scopes the job; it does not pause it.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}
    permissions:
      contents: write
      # Sigstore provenance for the installers below.
      id-token: write
      attestations: write
      # download-artifact reads this run's own artifacts.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ format('refs/tags/{0}', needs.prepare.outputs.tag) }}
          persist-credentials: false

      - name: Fetch the installers from every leg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: installers-*
          path: installers

      - name: Fetch the third-party notice parts from every target
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: third-party-notices-*
          path: notice-parts

      # One part per target, checked against the matrix: a missing target fails here.
      - name: Merge THIRD-PARTY-NOTICES
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("app/src-tauri/tauri.conf.json"))["version"])')"
          mkdir -p notices
          python3 scripts/third_party_notices.py \
            --merge $(find notice-parts -type f -name 'THIRD-PARTY-NOTICES.*.json' | sort) \
            --expect aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc x86_64-unknown-linux-gnu \
            --version "$VERSION" \
            --out notices/THIRD-PARTY-NOTICES.txt

      # One flat directory holds exactly what gets attested, checksummed and
      # shipped, so the three cannot disagree by construction.
      - name: Stage the installers
        run: |
          set -euo pipefail
          mkdir -p stage
          find installers -type f -name 'FlowMap_*' -print0 | while IFS= read -r -d '' f; do
            n="$(basename "$f")"
            if [ -e "stage/$n" ]; then echo "duplicate installer name: $n" >&2; exit 1; fi
            cp "$f" "stage/$n"
          done
          if [ -z "$(ls -A stage)" ]; then echo "no installers were downloaded"; exit 1; fi
          if [ ! -s notices/THIRD-PARTY-NOTICES.txt ]; then echo "missing THIRD-PARTY-NOTICES.txt"; exit 1; fi
          cp notices/THIRD-PARTY-NOTICES.txt stage/THIRD-PARTY-NOTICES.txt
          # The Apache-2.0 licence, the NOTICE text and the SIL OFL texts of the
          # bundled fonts travel with every release, as separate files.
          cp LICENSE NOTICE client/src/assets/fonts/LICENSE-inter.txt \
            client/src/assets/fonts/LICENSE-jetbrains-mono.txt client/src/assets/fonts/LICENSE-pixelify-sans.txt stage/
          ls -l stage

      # Signs a SLSA provenance statement for every installer BEFORE it is
      # uploaded, so the digest in the attestation is the digest of the file the
      # next step ships. Sigstore-backed and public — anyone can check a download
      # against it without trusting the release page:
      #   gh attestation verify <file> -R <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: stage/FlowMap_*

      # One SHA256SUMS for the whole release, in the `hash  basename` format that
      # `sha256sum -c` expects next to the downloads. It covers the installers and
      # the notices file, so every file a user downloads is in the manifest.
      - name: Assemble SHA256SUMS
        run: |
          set -euo pipefail
          (cd stage && sha256sum FlowMap_* THIRD-PARTY-NOTICES.txt LICENSE NOTICE \
            LICENSE-inter.txt LICENSE-jetbrains-mono.txt LICENSE-pixelify-sans.txt | sort -k2) > SHA256SUMS
          if [ ! -s SHA256SUMS ]; then echo "no checksum lines collected"; exit 1; fi
          cat SHA256SUMS

      # The approval can wait for hours. Re-read the release state right before anything
      # is created, edited, clobbered or deleted, so a release published in the meantime
      # is never overwritten.
      - name: Refuse to overwrite a release published during this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [ "$DRAFT" != "true" ]; then
              echo "Release $TAG was published before this publish job ran. Refusing to overwrite it." >&2
              exit 1
            fi
          fi

      - name: Ensure a draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="docs/release-notes-${TAG#v}.md"
          if [ ! -s "$NOTES" ]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # prepare refused a published release, but the release can be published
            # while this run is in flight. Only a draft may receive the new bytes.
            DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [ "$DRAFT" != "true" ]; then
              echo "Release $TAG was published while this run was in flight. Refusing to overwrite it." >&2
              exit 1
            fi
            echo "Release $TAG already exists as a draft — reusing it."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag               --title "FlowMap $TAG" --notes-file "$NOTES" --draft
          fi

      # Refuses a manifest whose last byte is a bare carriage return, before any checksum
      # tool reads it. GNU sha256sum on Linux has accepted that shape while Git Bash's
      # rejects it, so the verdict must not depend on the runner. Keep the release draft
      # if this fails.
      - name: Refuse a checksum manifest that ends in a bare carriage return
        run: |
          set -euo pipefail
          if [ -s SHA256SUMS ] && [ "$(tail -c 1 SHA256SUMS | od -An -tx1 | tr -d ' \n')" = "0d" ]; then
            echo "SHA256SUMS ends with a bare carriage return; keep the release draft and regenerate the manifest." >&2
            exit 1
          fi

      - name: Upload installers and SHA256SUMS to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          gh release upload "$TAG" stage/FlowMap_* stage/THIRD-PARTY-NOTICES.txt stage/LICENSE stage/NOTICE \
            stage/LICENSE-inter.txt stage/LICENSE-jetbrains-mono.txt stage/LICENSE-pixelify-sans.txt SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber

      # A stale installer from an earlier attempt must not survive into the
      # release. Any failure here fails the step: nothing is swallowed.
      - name: Remove stale FlowMap assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            case "$name" in
              FlowMap_*)
                if ! grep -Fxq "$name" <(awk '{print $2}' SHA256SUMS); then
                  echo "removing stale asset: $name"
                  gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
                fi
                ;;
            esac
          done <<< "$ASSETS"

      # The name check below proves which files exist. This step proves their
      # bytes: every uploaded installer is downloaded again from the release and
      # compared with SHA256SUMS, so a corrupted or clobbered upload blocks the
      # publish.
      - name: Verify the uploaded bytes against SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'FlowMap_*' --pattern 'THIRD-PARTY-NOTICES.txt' \
            --pattern LICENSE --pattern NOTICE \
            --pattern LICENSE-inter.txt --pattern LICENSE-jetbrains-mono.txt --pattern LICENSE-pixelify-sans.txt --dir verify
          # The manifest is the one computed above from the built files, not the
          # copy that came back from the release.
          cp SHA256SUMS verify/SHA256SUMS
          (cd verify && sha256sum -c SHA256SUMS)
          echo "uploaded bytes match SHA256SUMS"

      - name: Require all eight installers before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets > release-assets.json
          python3 scripts/validate_release_assets.py --tag "$TAG" \
            --checksums SHA256SUMS --assets release-assets.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
